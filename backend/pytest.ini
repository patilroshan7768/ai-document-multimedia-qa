[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --tb=short
    --strict-markers
    --cov=app
    --cov-report=term-missing
    --cov-fail-under=80

markers =
    asyncio: mark test as async
    unit: mark test as unit test
    integration: mark test as integration test
